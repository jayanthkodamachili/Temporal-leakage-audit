<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="Architecture of temporal-leakage-audit"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/></marker></defs><rect width="960" height="500" fill="#ffffff"/><text x="480.0" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b1f23">One pipeline, two instruments, one of them blind</text><rect x="24" y="60" width="200" height="66" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="124.0" y="80" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">feature definitions</text><text x="124.0" y="98" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">window, ingestion lag,</text><text x="124.0" y="112" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">dependency graph</text><rect x="300" y="58" width="268" height="50" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="434.0" y="78" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">materialise the features</text><text x="434.0" y="96" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">the future goes into the column</text><rect x="300" y="128" width="268" height="50" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="434.0" y="148" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">split the rows</text><text x="434.0" y="166" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">shuffled or walk-forward</text><rect x="300" y="198" width="268" height="50" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="434.0" y="218" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">train and score</text><text x="434.0" y="236" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">every fold sees the same leak</text><line x1="224" y1="86" x2="300" y2="83" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="434" y1="108" x2="434" y2="128" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="434" y1="178" x2="434" y2="198" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="640" y="148" width="190" height="60" rx="6" fill="#fff5f4" stroke="#b42318" stroke-width="1.5"/><text x="735.0" y="168" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">a high score</text><text x="735.0" y="186" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">no diagnostic objects</text><line x1="568" y1="223" x2="640" y2="196" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="300" y="300" width="268" height="64" rx="6" fill="#f2fbf4" stroke="#116329" stroke-width="1.5"/><text x="434.0" y="320" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">read every window against zero</text><text x="434.0" y="338" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">is this value knowable</text><text x="434.0" y="352" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">when the prediction is made?</text><line x1="224" y1="110" x2="300" y2="318" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="640" y="300" width="190" height="64" rx="6" fill="#f2fbf4" stroke="#116329" stroke-width="1.5"/><text x="735.0" y="320" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">named violations</text><text x="735.0" y="338" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">before a model exists</text><line x1="568" y1="332" x2="640" y2="332" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><text x="434" y="282" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#57606a">no data, no model, no training</text><rect x="130" y="416" width="700" height="62" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="480.0" y="436" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">the splitter is not the lever; the definition is</text><text x="480.0" y="454" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">changing how the rows are divided recovers almost none of what a leaking column gave away</text><line x1="735" y1="208" x2="600" y2="416" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="735" y1="364" x2="420" y2="416" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/></svg>
