name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # The suite is its own step. A failing test that surfaces as a traceback from the
      # metrics collector is far harder to attribute from the Actions UI than a red
      # pytest step.
      - name: run the suite
        run: |
          pytest --junitxml=junit.xml \
                 --cov=leakage_audit --cov-report=json --cov-report=term \
                 --cov-fail-under=100 -q
      - name: upload test artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.python-version }}
          path: |
            junit.xml
            coverage.json

  receipts:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: run the suite for its reports
        run: |
          pytest --junitxml=junit.xml --cov=leakage_audit --cov-report=json -q
      # Experiments are re-run from scratch rather than trusted from the repository, so a
      # committed JSON that no longer matches the code cannot survive a merge.
      - name: re-measure every published figure
        run: python tools/collect_metrics.py --skip-tests
      - name: fail on any figure the code no longer produces
        run: python tools/check_numbers.py
      - name: confirm the committed experiment output still matches
        run: git diff --exit-code docs/experiments docs/metrics.json
      
      - name: upload experiment output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-json
          path: docs/experiments

  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: regenerate the committed figures
        run: |
          python tools/render_diagram.py
          python tools/capture_cli.py
      - name: fail if a committed figure is stale
        run: git diff --exit-code docs/architecture.svg docs/evidence-manifest.json
